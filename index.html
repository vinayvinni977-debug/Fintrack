<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FinTrack</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com; manifest-src 'self'">

<style>
:root{--bg:#07080a;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f2f3f1;--mu:#8d968f;--g:#27c984;--r:#ef4b43;--ac:#f2f3f1;--g1:#27c984;--o1:#e6a13a;--o2:#ef4b43;--cd:rgba(255,255,255,.08);color-scheme:dark;box-sizing:border-box}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f2;--card:rgba(10,20,15,.035);--card2:rgba(10,20,15,.06);--bd:rgba(10,20,15,.12);--tx:#10140f;--mu:#596357;--g:#0f9d6a;--r:#c43a30;--cd:rgba(10,20,15,.07);color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg)}
html{background:radial-gradient(900px 500px at 20% -10%,rgba(39,201,132,.12) 0%,transparent 60%),var(--bg);background-attachment:fixed}
#main{padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;animation:rise .4s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:800 26px/1.1 "Segoe UI",system-ui,sans-serif;margin:10px 0 2px;letter-spacing:-.3px}
h2{font:800 40px/1 "Segoe UI",system-ui,sans-serif;margin:6px 0;letter-spacing:-1px}
h3{margin:20px 0 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--mu)}
.mu,small{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0;
 animation:rise .35s cubic-bezier(.16,1,.3,1) both}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .card{margin:0}
.card.g{border-top:2px solid var(--g);background:linear-gradient(180deg,rgba(39,201,132,.09),var(--card) 60%)}
.card.r{border-top:2px solid var(--r);background:linear-gradient(180deg,rgba(239,75,67,.09),var(--card) 60%)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.gt{color:var(--g)}.rt{color:var(--r)}
button,select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:11px;min-height:44px}
button{cursor:pointer;transition:transform .12s,filter .15s}
button:active{transform:scale(.96);filter:brightness(1.1)}
button:disabled{opacity:.4}
button.pri{background:var(--tx);color:var(--bg);border:none;width:100%;margin-top:10px;font-weight:700}
button.sm{min-height:36px;padding:6px 12px}
button.ghost{background:var(--cd);color:var(--tx);border:1px solid var(--bd);width:100%;margin-top:6px;font-weight:600}
button.danger{background:var(--r);color:#fff;border:none;width:100%;margin-top:10px;font-weight:700}
button.danger:disabled{opacity:.4}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.chips button{white-space:nowrap;min-height:34px;padding:6px 14px;border-radius:99px;font-size:13px}
.chips .on{background:var(--tx);color:var(--bg);border-color:transparent;font-weight:700}
input,select{width:100%;margin:6px 0}
label{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-top:10px}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;
 background:rgba(10,12,11,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
 border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:0 16px 40px -16px rgba(0,0,0,.7);max-width:536px;margin:auto}
@media(prefers-color-scheme:light){nav{background:rgba(244,245,242,.88)}}
nav button{flex:1;border:0;border-radius:20px;background:none;font-size:11px;min-height:48px;transition:background .2s,color .2s}
nav .on{color:var(--g);font-weight:700;background:rgba(39,201,132,.14)}
nav .plus{background:var(--g);color:#06241a;border-radius:50%;flex:0 0 48px;min-height:48px;font-size:23px;margin:-12px 4px 0}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:5}
#sh.o{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
#sh>div{background:#0c0d0f;width:100%;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:560px;margin:auto;
 border-top:1px solid var(--bd);box-shadow:0 -20px 50px -20px rgba(0,0,0,.7);animation:slideUp .3s cubic-bezier(.16,1,.3,1);outline:none}
@media(prefers-color-scheme:light){#sh>div{background:#fff}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tl{padding:9px 0 9px 14px;border-left:2px solid var(--bd)}
a{color:var(--g);cursor:pointer;text-decoration:underline}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card2);text-transform:uppercase;letter-spacing:.5px}
.due{animation:glow 1.8s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(39,201,132,.15)}}
.paid{color:var(--g);font-weight:700;padding:10px 0}
#t{position:fixed;left:14px;right:14px;bottom:88px;background:#15171a;color:var(--tx);padding:13px 16px;border-radius:14px;
 border:1px solid var(--bd);display:none;justify-content:space-between;align-items:center;z-index:9;max-width:536px;margin:auto;
 box-shadow:0 16px 40px -16px rgba(0,0,0,.7);animation:rise .22s cubic-bezier(.16,1,.3,1)}
#t button{background:none;color:var(--g);border:1px solid var(--g);min-height:32px;padding:4px 12px}
@media(prefers-color-scheme:light){#t{background:#fff;box-shadow:0 16px 40px -16px rgba(10,20,15,.35)}}
textarea{width:100%;height:160px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px}
.xp{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .28s cubic-bezier(.16,1,.3,1),visibility 0s .28s}
.xp.o{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .28s cubic-bezier(.16,1,.3,1),visibility 0s}
.xp-in{overflow:hidden}
.xp-in .row:last-child{border:0}
.pbar{height:4px;border-radius:99px;background:var(--card2);margin-top:6px;overflow:hidden}
.pbar>div{height:100%;border-radius:99px;transition:width .3s}
.row[role="button"]{cursor:pointer;border-radius:8px}
.row[role="button"]:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hero h2{font-size:clamp(20px,7.5vw,34px);word-break:break-word}
</style></head><body>
<div id="main"></div><div id="sh" onclick="if(event.target==this){duePending=false;closeSh()}"><div id="shc" role="dialog" aria-modal="true" tabindex="-1"></div></div><div id="t"></div>
<nav><button data-t="dash" onclick="go('dash')">Home</button><button data-t="people" onclick="go('people')">People</button><button class="plus" onclick="openAdd()" aria-label="Add">+</button><button data-t="txns" onclick="go('txns')">Txns</button><button data-t="due" onclick="go('due')">Due</button><button data-t="more" onclick="go('more')">More</button></nav>
<script>
const $=s=>document.querySelector(s),K='fintrack_v1';
let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{people:[],obs:[],pays:[],ints:[],audit:[],self:[],recentSpends:0,rsLog:[]};
if(!db.self)db.self=[];
if(db.recentSpends==null)db.recentSpends=0;
if(!db.rsLog)db.rsLog=[];
var ghT;const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){
 try{const raw=localStorage.getItem(K);if(raw)db=JSON.parse(raw)}catch(_){}
 toast('Could not save to browser storage — change not kept. Export a backup from More.');render();return false}
 clearTimeout(ghT);ghT=setTimeout(()=>{if(localStorage.getItem('gh_tok'))ghBackup(1)},5000);return true};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const p2=n=>String(n).padStart(2,'0'),fISO=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>fISO(new Date());
const addM=(s,n)=>{const[y,m,d]=s.split('-').map(Number),l=new Date(y,m+n,0).getDate();return fISO(new Date(y,m-1+n,Math.min(d,l)))};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],fd=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return +d+' '+MN[m-1]+' '+y};
const R=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});
const P=v=>Math.round(parseFloat(v)*100),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paidOf=(o,u)=>db.pays.reduce((s,p)=>(u&&p.date>u)?s:s+p.alloc.filter(a=>a.oid===o.id).reduce((x,a)=>x+a.amt,0),0);
const intOf=(o,u)=>db.ints.filter(i=>i.oid===o.id&&(!u||i.date<=u)).reduce((s,i)=>s+i.amt,0);
const bal=(o,u)=>(u&&o.date>u)?0:o.principal+intOf(o,u)-paidOf(o,u);
const live=o=>!o.deleted,act=o=>live(o)&&bal(o)>0;
const pName=id=>(db.people.find(p=>p.id===id)||{name:'(missing)'}).name;
const pBal=(id,d)=>db.obs.filter(o=>o.pid===id&&o.dir===d&&live(o)).reduce((s,o)=>s+bal(o),0);
const actObs=(id,d)=>db.obs.filter(o=>o.pid===id&&o.dir===d&&act(o)).sort((a,b)=>a.due<b.due?-1:1);
function accrue(){}
let snap=null;
function commit(msg,fn,audit){snap=JSON.stringify(db);fn();if(audit){db.audit.push({id:uid(),at:new Date().toISOString(),t:audit});if(db.audit.length>500)db.audit=db.audit.slice(-500)}accrue();const ok=save();closeSh();render();if(ok)toast(msg,1);if(duePending){duePending=false;DQI++;setTimeout(showDue,300)}}
function toast(m,u){const t=$('#t');t.innerHTML=`<span>${esc(m)}</span>${u?'<button onclick="undo()">Undo</button>':''}`;t.style.display='flex';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',u?7000:4000)}
function undo(){if(!snap)return;db=JSON.parse(snap);snap=null;save();render();toast('Undone')}
const S={tab:'dash',pid:null,f:'all',q:'',tf:'all',txSort:'new'};
function go(t){S.tab=t;S.pid=null;S.q='';render()}
function openP(id){S.pid=id;render();scrollTo(0,0)}
function sheet(h){$('#shc').innerHTML=h;$('#sh').classList.add('o');try{$('#shc').focus({preventScroll:true})}catch(e){}}function closeSh(){$('#sh').classList.remove('o')}
function countUp(e,to){const st=performance.now();if(matchMedia('(prefers-reduced-motion:reduce)').matches||!to){e.textContent=R(to);return}const f=n=>{const k=Math.min(1,(n-st)/700);e.textContent=R(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function render(){const m=$('#main');m.style.animation='none';m.offsetHeight;m.style.animation='';
 m.innerHTML=S.pid?vPerson():({dash:vDash,people:vPeople,txns:vTxns,due:vDue,more:vMore}[S.tab])();
 document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab&&!S.pid));
 document.querySelectorAll('[data-n]').forEach(e=>countUp(e,+e.dataset.n))}
const sumDir=d=>db.people.reduce((s,p)=>s+pBal(p.id,d),0),cnt=d=>db.people.filter(p=>pBal(p.id,d)>0).length;
const dCtx=o=>o.due===today()?'Due today':o.due<today()?'Past due':'Upcoming';
function obRow(o,btn){const b=bal(o);return `<div class="row"><div role="button" tabindex="0" onclick="openOb('${o.id}')"><b>${esc(pName(o.pid))}</b> <small>${esc(o.desc||'')}</small><br><small>${b>0?dCtx(o)+' · '+fd(o.due):'Paid'}${o.pct?' · '+o.pct+'%/mo':o.interest?' · ₹'+o.interest/100+'/mo':''}${nx(o)?'<br>If unpaid after '+fd(o.due)+': '+R(bal(o)+nx(o)):''}</small></div><div style="text-align:right"><b class="${o.dir=='lent'?'gt':'rt'}" onclick="openOb('${o.id}')">${R(b)}</b><br>${b>0&&o.dir=='lent'?`<button class="sm" style="padding:2px 8px;min-height:28px" onclick="remind('${o.id}')">Remind</button>`:`<span class="pill">${b>0?'Unpaid':'Paid'}</span>`}</div></div>`}
function recent(){const e=[];db.obs.filter(live).forEach(o=>e.push({d:o.date,k:0,t:(o.dir=='lent'?'Lent '+R(o.principal)+' to ':'Borrowed '+R(o.principal)+' from ')+pName(o.pid)}));
 db.ints.forEach(i=>{const o=db.obs.find(x=>x.id===i.oid);if(o&&live(o))e.push({d:i.date,k:1,t:R(i.amt)+' interest added · '+pName(o.pid)})});
 db.pays.forEach(p=>e.push({d:p.date,k:2,t:pName(p.pid)+(p.settle?' settled ':(p.dir=='lent'?' repaid ':' — you paid ')+' ')+R(p.amt)}));
 return e.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.k-a.k).slice(0,8).map(x=>`<div class="row"><span>${esc(x.t)}</span><small>${fd(x.d)}</small></div>`).join('')||'<p class="mu">No activity yet.</p>'}
function vDash(){const h=new Date().getHours(),L=sumDir('lent'),O=sumDir('owe');
 const top=d=>db.people.map(p=>[p,pBal(p.id,d)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([p,b])=>`<div class="row" role="button" tabindex="0" aria-expanded="${XP===p.id+'|'+d}" onclick="togglePersonExpand('${p.id}','${d}',this)"><span>${esc(p.name)}</span><b>${R(b)}</b></div>${personExpandHtml(p,d)}`).join('');
 const ym=today().slice(0,7),mSelf=db.self.filter(x=>x.date.slice(0,7)===ym),useSelf=mSelf.length>0,sp=useSelf?mSelf.reduce((s,x)=>s+x.amt,0):(db.recentSpends||0);
 const dt=db.obs.filter(o=>act(o)&&o.due===today());
 return `<h1>FinTrack</h1><p class="mu">Good ${h<12?'morning':h<17?'afternoon':'evening'}</p>
 <div class="hero"><div class="card g"><small>Others owe me</small><h2 class="gt" data-n="${L}">${R(L)}</h2><small>${cnt('lent')} people</small></div><div class="card r" onclick="openRS()"><small>Spends by me</small><h2 class="rt" data-n="${sp}">${R(sp)}</h2><small>This month · tap to update</small>${useSelf?'':rsStaleNote()}</div></div>
 ${dt.length?`<h3>Due today</h3>${dt.map(o=>`<div class="card due"><b>${esc(pName(o.pid))}</b> <small>${esc(o.desc||'')}</small><h3 style="margin:4px 0">${R(bal(o))} <span class="pill">Unpaid</span></h3><button class="sm" onclick="openRepay('${o.pid}','${o.dir}')">Record payment</button> <button class="sm" onclick="remind('${o.id}')">Remind</button></div>`).join('')}`:''}
 ${top('lent')?`<h3>Others owe me</h3><div class="card">${top('lent')}</div>`:''}${top('owe')?`<h3>I owe</h3><div class="card">${top('owe')}</div>`:''}
 ${!db.obs.length?'<div class="card"><b>Your ledger is empty.</b><br><small>Tap + to record money you lent or owe.</small></div>':''}
 <h3>Recent activity</h3><div class="card">${recent()}</div>`}
function chips(k,arr){return `<div class="chips">${arr.map(([v,l])=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}='${v}';render()">${l}</button>`).join('')}</div>`}
function qInput(el){S.q=el.value;clearTimeout(window.st);const p=el.selectionStart;window.st=setTimeout(()=>{render();const i=$('#q');if(i){i.focus();i.setSelectionRange(p,p)}},250)}
function srch(){return `<input id="q" placeholder="Search name, description, notes, date" value="${esc(S.q)}" oninput="qInput(this)">`}
const hit=o=>!S.q||(pName(o.pid)+' '+(o.desc||'')+' '+(o.notes||'')+' '+(o.date||'')+' '+(o.due||'')).toLowerCase().includes(S.q.toLowerCase());
function vPeople(){const f=S.f;const ps=db.people.filter(p=>(!S.q||p.name.toLowerCase().includes(S.q.toLowerCase())||db.obs.some(o=>o.pid===p.id&&hit(o)))&&(f=='all'||(f=='lent'&&pBal(p.id,'lent')>0)||(f=='owe'&&pBal(p.id,'owe')>0)||(f=='settled'&&!pBal(p.id,'lent')&&!pBal(p.id,'owe'))));
 return `<h1>People</h1>${srch()}${chips('f',[['all','All'],['lent','Others owe me'],['owe','I owe'],['settled','Settled']])}<div class="card">${ps.map(p=>{const a=pBal(p.id,'lent'),b=pBal(p.id,'owe'),sv=[a?`<b class="gt">${R(a)}</b>`:'',b?`<b class="rt">${R(b)}</b>`:''].filter(Boolean).join(' ');return `<div class="row" role="button" tabindex="0" onclick="openP('${p.id}')"><b>${esc(p.name)}</b><span>${sv||'<span class="pill">Settled</span>'}</span></div>`}).join('')||'<p class="mu">No one here yet.</p>'}</div>`}
const txSorters={new:(a,b)=>a.date<b.date?1:a.date>b.date?-1:0,old:(a,b)=>a.date<b.date?-1:a.date>b.date?1:0,big:(a,b)=>b.principal-a.principal,due:(a,b)=>a.due<b.due?-1:a.due>b.due?1:0};
function vTxns(){const f=S.tf,os=db.obs.filter(o=>hit(o)&&(f=='del'?o.deleted:live(o)&&(f=='all'||(f=='unpaid'&&bal(o)>0)||(f=='paid'&&bal(o)<=0)||(f=='lent'&&o.dir=='lent')||(f=='owe'&&o.dir=='owe')))).sort(txSorters[S.txSort]||txSorters.new);
 return `<h1>Transactions</h1>${srch()}${chips('tf',[['all','All'],['unpaid','Unpaid'],['paid','Paid'],['del','Deleted']])}<select aria-label="Sort" onchange="S.txSort=this.value;render()">${[['new','Newest'],['old','Oldest'],['big','Largest'],['due','Due soonest']].map(([v,l])=>`<option value="${v}" ${S.txSort==v?'selected':''}>${l}</option>`).join('')}</select><div class="card">${os.map(o=>obRow(o)).join('')||'<p class="mu">Nothing found.</p>'}</div>`}
function vDue(){const os=db.obs.filter(act).sort((a,b)=>a.due<b.due?-1:1),g=(l,fn)=>{const x=os.filter(fn);return x.length?`<h3>${l}</h3><div class="card">${x.map(o=>obRow(o)).join('')}</div>`:''};
 return `<h1>Due</h1>${('Notification' in window&&Notification.permission==='default')?'<button class="sm" onclick="enableNotif()">Enable reminders</button>':''}${g('Past due',o=>o.due<today())}${g('Due today',o=>o.due==today())}${g('Upcoming',o=>o.due>today())}${os.length?'':'<div class="card">Nothing is due. Your ledger is clear ✓</div>'}`}
function vPerson(){const p=db.people.find(x=>x.id===S.pid);if(!p){S.pid=null;return vDash()}
 const os=db.obs.filter(o=>o.pid===p.id&&live(o));
 const blk=d=>{const x=os.filter(o=>o.dir===d);if(!x.length)return'';const b=pBal(p.id,d),a=x.filter(act),nx=a.map(o=>o.due).sort()[0];
  return `<div class="card ${d=='lent'?'g':'r'}"><small>${d=='lent'?'Others owe me':'I owe'} · balance as of ${fd(today())}</small><h2 class="${d=='lent'?'gt':'rt'}">${R(b)}</h2>
  <small>${d=='lent'?'Total lent':'Total borrowed'} ${R(x.reduce((s,o)=>s+o.principal,0))} · Repaid ${R(x.reduce((s,o)=>s+paidOf(o),0))} · Active ${a.length} · Next due ${fd(nx)}</small>
  ${b>0?`<br><button class="sm" onclick="openRepay('${p.id}','${d}')">Record payment</button> <button class="sm" onclick="settle('${p.id}','${d}')">Settle account</button>${d=='lent'?` <button class="sm" onclick="remindTotal('${p.id}')">Remind total</button>`:''}`:'<div class="paid">✓ Settled</div>'}</div>`};
 const hs=[];db.pays.filter(y=>y.pid===p.id).forEach(y=>hs.push([y.date,(y.settle?'Settled ':'Payment ')+R(y.amt),'pay',y.id]));db.ints.forEach(i=>{const o=db.obs.find(x=>x.id===i.oid);if(o&&o.pid===p.id&&live(o))hs.push([i.date,'Interest +'+R(i.amt),'int',i.id])});hs.sort((a,b)=>a[0]<b[0]?1:a[0]>b[0]?-1:0);

 let prev=null;return mlist.map(m=>{const v=forMonth(m),[y,mo]=m.split('-'),lab=new Date(+y,+mo-1,1).toLocaleString('en',{month:'short',year:'2-digit'});
  let delta='';if(v!=null&&prev!=null)delta=v>=prev?`<small class="rt">▲ ${R(v-prev)}</small>`:`<small class="gt">▼ ${R(prev-v)}</small>`;

function rsStaleNote(){const latest=db.rsLog.slice().sort((a,b)=>a.date<b.date?1:-1)[0];

 return days>30?`<br><small class="rt">⚠ Last updated ${days} days ago</small>`:'';}


function pacePct(o){const a=new Date(o.date),b=new Date(o.due),n=new Date(today());if(b<=a)return 100;
 return Math.max(0,Math.min(100,Math.round((n-a)/(b-a)*100)))}

function checks(d){const prev=db;if(d)db=d;try{return _checks()}finally{db=prev}}
function _checks(){const e=[],ids=new Set();[...db.people,...db.obs,...db.pays,...db.ints].forEach(x=>{if(ids.has(x.id))e.push('Duplicate ID '+x.id);ids.add(x.id)});
 db.obs.forEach(o=>{if(!db.people.find(p=>p.id===o.pid))e.push('Missing person on '+(o.desc||o.id));if(!o.due)e.push('Missing due date: '+(o.desc||o.id));if(bal(o)<0)e.push('Negative balance: '+pName(o.pid)+' '+(o.desc||''));if(o.pct>100)e.push('Interest % over 100: '+pName(o.pid)+' '+(o.desc||''))});
 db.ints.forEach(i=>{const o=db.obs.find(x=>x.id===i.oid);if(!o)e.push('Orphan interest event '+i.id);else if(o.deleted)e.push('Note: interest event on a deleted transaction ('+pName(o.pid)+', '+fd(i.date)+')')});
 db.pays.forEach(p=>{const s=p.alloc.reduce((x,a)=>x+a.amt,0);if(s!==p.amt)e.push('Allocation ≠ payment: '+pName(p.pid)+' '+fd(p.date));p.alloc.forEach(a=>{if(!db.obs.find(o=>o.id===a.oid))e.push('Payment points to missing transaction')})});return e}

function verifyBackup(d){const e=[];if(!d||typeof d!=='object'||Array.isArray(d))return['Backup is not a FinTrack data object'];

 const num=v=>typeof v==='number'&&isFinite(v),dt=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
 d.people.forEach((p,i)=>{if(!p||!p.id||typeof p.name!=='string')e.push('Person #'+(i+1)+' is missing an id or name')});
 d.obs.forEach((o,i)=>{if(!o||!o.id||!o.pid||!num(o.principal)||o.principal<0||!dt(o.date)||!dt(o.due)||(o.dir!=='lent'&&o.dir!=='owe'))e.push('Transaction #'+(i+1)+' has missing or invalid fields')});
 d.pays.forEach((p,i)=>{if(!p||!p.id||!num(p.amt)||!dt(p.date)||!Array.isArray(p.alloc)||p.alloc.some(a=>!a||!a.oid||!num(a.amt)))e.push('Payment #'+(i+1)+' has missing or invalid fields')});
 d.ints.forEach((x,i)=>{if(!x||!x.id||!x.oid||!num(x.amt)||!dt(x.date))e.push('Interest event #'+(i+1)+' has missing or invalid fields')});
 d.self.forEach((x,i)=>{if(!x||!num(x.amt)||!dt(x.date))e.push('Spend entry #'+(i+1)+' is invalid')});
 d.rsLog.forEach((x,i)=>{if(!x||!x.id||!num(x.amt)||!dt(x.date))e.push('Recent-spends entry #'+(i+1)+' is invalid')});
 if(e.length)return e;
 return checks(d).filter(x=>!x.startsWith('Note:'))}

 if(ghBusy){ghAgain=true;if(!a)toast('A backup is already running — it will include your latest changes');return}
 ghBusy=true;let ok=false,msg='';
 try{for(let t=0;t<2&&!ok;t++){let sha=null;const g=await ghCall('fintrack-backup.json');if(g&&g.ok){sha=(await g.json()).sha}
   const body={message:'FinTrack backup '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(db))))};if(sha)body.sha=sha;
   const res=await ghCall('fintrack-backup.json',{method:'PUT',body:JSON.stringify(body)});
   if(res&&res.ok){ok=true}else{if(res&&res.status===409&&t===0)continue;let e={};try{e=res?await res.json():{}}catch(_){}msg=e.message||'error';break}}
 }catch(e){msg='check your connection'}finally{ghBusy=false}
 if(!a)toast(ok?'Backed up to GitHub':'GitHub backup failed: '+msg);
 if(ghAgain){ghAgain=false;ghBackup(1)}}
async function ghRestore(){if(!localStorage.getItem('gh_tok'))return toast('Set up GitHub backup first');
 let d;try{const g=await ghCall('fintrack-backup.json');if(!g||!g.ok)return toast('No GitHub backup found yet');
  d=JSON.parse(decodeURIComponent(escape(atob((await g.json()).content))))}catch(e){return showErrs('Could not read GitHub backup',[String(e.message||e)])}
 const er=verifyBackup(d);if(er.length)return showErrs('GitHub backup rejected',er);
 sure('Restore the GitHub backup? This replaces current data.',()=>commit('GitHub backup restored',()=>{db=d},'Restored GitHub backup'))}
