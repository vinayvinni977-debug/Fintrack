<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FinTrack</title>
<meta name="theme-color" content="#0a7a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f5f2;--cd:#fff;--tx:#14201b;--mu:#66736c;--bd:#e2e6e1;--g:#0a7a4f;--r:#c0392b;--ac:#14201b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1311;--cd:#171e1b;--tx:#eef2ef;--mu:#8a9891;--bd:#26302c;--g:#3ddc97;--r:#ff7b6b;--ac:#eef2ef}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
#main{padding:14px 14px 96px;max-width:560px;margin:auto;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font:700 26px Georgia,serif;margin:6px 0}h2{font:700 34px Georgia,serif;margin:4px 0}h3{margin:14px 0 6px}
.mu,small{color:var(--mu)}.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero .card{margin:0}.g{border-top:4px solid var(--g)}.r{border-top:4px solid var(--r)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.gt{color:var(--g)}.rt{color:var(--r)}
button,select,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:11px;min-height:44px}
button{cursor:pointer;transition:transform .1s}button:active{transform:scale(.96)}button:disabled{opacity:.4}
button.pri{background:var(--ac);color:var(--bg);width:100%;margin-top:10px;font-weight:600}button.sm{min-height:36px;padding:6px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{white-space:nowrap;min-height:36px;padding:6px 12px;border-radius:99px}.chips .on{background:var(--ac);color:var(--bg)}
input,select{width:100%;margin:5px 0}label{display:block;color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;min-height:56px}nav .on{color:var(--g);font-weight:700}
nav .plus{background:var(--ac);color:var(--bg);border-radius:50%;flex:0 0 52px;min-height:52px;font-size:26px;margin:-16px 4px 0}
#sh{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}#sh.o{display:flex}
#sh>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;max-width:560px;margin:auto;animation:in .2s}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tl{padding:8px 0 8px 12px;border-left:2px solid var(--bd)}a{color:var(--g);cursor:pointer;text-decoration:underline}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.due{animation:pl 1.6s 2}@keyframes pl{50%{box-shadow:0 0 0 5px #0a7a4f33}}
.paid{color:var(--g);font-weight:700;padding:8px 12px}
#t{position:fixed;left:12px;right:12px;bottom:80px;background:var(--ac);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;justify-content:space-between;align-items:center;z-index:9;max-width:536px;margin:auto}
#t button{background:none;color:inherit;border:1px solid;min-height:32px;padding:4px 10px}
textarea{width:100%;height:160px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="main"></div><div id="sh" onclick="if(event.target==this)closeSh()"><div id="shc"></div></div><div id="t"></div>
<nav><button data-t="dash" onclick="go('dash')">Home</button><button data-t="people" onclick="go('people')">People</button><button class="plus" onclick="openAdd()" aria-label="Add">+</button><button data-t="txns" onclick="go('txns')">Txns</button><button data-t="due" onclick="go('due')">Due</button><button data-t="more" onclick="go('more')">More</button></nav>
<script>
const $=s=>document.querySelector(s),K='fintrack_v1';
let db=null;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{people:[],obs:[],pays:[],ints:[],audit:[]};
var ghT;const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Could not save to browser storage. Export a backup.')}clearTimeout(ghT);ghT=setTimeout(()=>{if(localStorage.getItem('gh_tok'))ghBackup(1)},5000)};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const p2=n=>String(n).padStart(2,'0'),fISO=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=()=>fISO(new Date());
const addM=(s,n)=>{const[y,m,d]=s.split('-').map(Number),l=new Date(y,m+n,0).getDate();return fISO(new Date(y,m-1+n,Math.min(d,l)))};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],fd=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return +d+' '+MN[m-1]+' '+y};
const R=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:p%100?2:0,maximumFractionDigits:2});
const P=v=>Math.round(parseFloat(v)*100),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paidOf=(o,u)=>db.pays.reduce((s,p)=>(u&&p.date>u)?s:s+p.alloc.filter(a=>a.oid===o.id).reduce((x,a)=>x+a.amt,0),0);
const intOf=(o,u)=>db.ints.filter(i=>i.oid===o.id&&(!u||i.date<=u)).reduce((s,i)=>s+i.amt,0);
const bal=(o,u)=>(u&&o.date>u)?0:o.principal+intOf(o,u)-paidOf(o,u);
const live=o=>!o.deleted,act=o=>live(o)&&bal(o)>0;
const pName=id=>(db.people.find(p=>p.id===id)||{name:'(missing)'}).name;
const pBal=(id,d)=>db.obs.filter(o=>o.pid===id&&o.dir===d&&live(o)).reduce((s,o)=>s+bal(o),0);
const actObs=(id,d)=>db.obs.filter(o=>o.pid===id&&o.dir===d&&act(o)).sort((a,b)=>a.due<b.due?-1:1);
function accrue(){let c=0;db.obs.forEach(o=>{if(o.deleted)return;let g=0;while((o.interest||o.pct)&&o.due<today()&&g++<240){const b=bal(o,o.due),a=o.pct?Math.round(b*o.pct/100):o.interest;if(b>0&&a>0)db.ints.push({id:uid(),oid:o.id,date:o.due,amt:a});o.due=addM(o.due,1);c=1}});if(c)save()}
let snap=null;
function commit(msg,fn,audit){snap=JSON.stringify(db);fn();if(audit)db.audit.push({id:uid(),at:new Date().toISOString(),t:audit});accrue();save();closeSh();render();toast(msg,1)}
function toast(m,u){const t=$('#t');t.innerHTML=`<span>${esc(m)}</span>${u?'<button onclick="undo()">Undo</button>':''}`;t.style.display='flex';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',u?7000:4000)}
function undo(){if(!snap)return;db=JSON.parse(snap);snap=null;save();render();toast('Undone')}
const S={tab:'dash',pid:null,f:'all',q:'',tf:'all'};
function go(t){S.tab=t;S.pid=null;S.q='';render()}
function openP(id){S.pid=id;render();scrollTo(0,0)}
function sheet(h){$('#shc').innerHTML=h;$('#sh').classList.add('o')}function closeSh(){$('#sh').classList.remove('o')}
function countUp(e,to){const st=performance.now();if(matchMedia('(prefers-reduced-motion:reduce)').matches||!to){e.textContent=R(to);return}const f=n=>{const k=Math.min(1,(n-st)/700);e.textContent=R(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function render(){const m=$('#main');m.style.animation='none';m.offsetHeight;m.style.animation='';
 m.innerHTML=S.pid?vPerson():({dash:vDash,people:vPeople,txns:vTxns,due:vDue,more:vMore}[S.tab])();
 document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab&&!S.pid));
 document.querySelectorAll('[data-n]').forEach(e=>countUp(e,+e.dataset.n))}
const sumDir=d=>db.people.reduce((s,p)=>s+pBal(p.id,d),0),cnt=d=>db.people.filter(p=>pBal(p.id,d)>0).length;
const dCtx=o=>o.due===today()?'Due today':o.due<today()?'Past due':'Upcoming';
function obRow(o,btn){const b=bal(o);return `<div class="row"><div onclick="openOb('${o.id}')"><b>${esc(pName(o.pid))}</b> <small>${esc(o.desc||'')}</small><br><small>${b>0?dCtx(o)+' · '+fd(o.due):'Paid'}${o.pct?' · '+o.pct+'%/mo':o.interest?' · ₹'+o.interest/100+'/mo':''}${nx(o)?'<br>If unpaid after '+fd(o.due)+': '+R(bal(o)+nx(o)):''}</small></div><div style="text-align:right"><b class="${o.dir=='lent'?'gt':'rt'}" onclick="openOb('${o.id}')">${R(b)}</b><br>${b>0&&o.dir=='lent'?`<button class="sm" style="padding:2px 8px;min-height:28px" onclick="remind('${o.id}')">Remind</button>`:`<span class="pill">${b>0?'Unpaid':'Paid'}</span>`}</div></div>`}
function recent(){const e=[];db.obs.filter(live).forEach(o=>e.push({d:o.date,k:0,t:(o.dir=='lent'?'Lent '+R(o.principal)+' to ':'Borrowed '+R(o.principal)+' from ')+pName(o.pid)}));
 db.ints.forEach(i=>{const o=db.obs.find(x=>x.id===i.oid);if(o&&live(o))e.push({d:i.date,k:1,t:R(i.amt)+' interest added · '+pName(o.pid)})});
 db.pays.forEach(p=>e.push({d:p.date,k:2,t:pName(p.pid)+(p.settle?' settled ':(p.dir=='lent'?' repaid ':' — you paid ')+' ')+R(p.amt)}));
 return e.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.k-a.k).slice(0,8).map(x=>`<div class="row"><span>${esc(x.t)}</span><small>${fd(x.d)}</small></div>`).join('')||'<p class="mu">No activity yet.</p>'}
function vDash(){const h=new Date().getHours(),L=sumDir('lent'),O=sumDir('owe');
 const top=d=>db.people.map(p=>[p,pBal(p.id,d)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([p,b])=>`<div class="row" onclick="openP('${p.id}')"><span>${esc(p.name)}</span><b>${R(b)}</b></div>`).join('');
 const dt=db.obs.filter(o=>act(o)&&o.due===today());
 return `<h1>FinTrack</h1><p class="mu">Good ${h<12?'morning':h<17?'afternoon':'evening'}</p>
 <div class="hero"><div class="card g"><small>Others owe me</small><h2 class="gt" data-n="${L}">${R(L)}</h2><small>${cnt('lent')} people</small></div><div class="card r"><small>I owe</small><h2 class="rt" data-n="${O}">${R(O)}</h2><small>${cnt('owe')} people</small></div></div>
 ${dt.length?`<h3>Due today</h3>${dt.map(o=>`<div class="card due"><b>${esc(pName(o.pid))}</b> <small>${esc(o.desc||'')}</small><h3 style="margin:4px 0">${R(bal(o))} <span class="pill">Unpaid</span></h3><button class="sm" onclick="openRepay('${o.pid}','${o.dir}')">Record payment</button> <button class="sm" onclick="remind('${o.id}')">Remind</button></div>`).join('')}`:''}
 ${top('lent')?`<h3>Others owe me</h3><div class="card">${top('lent')}</div>`:''}${top('owe')?`<h3>I owe</h3><div class="card">${top('owe')}</div>`:''}
 ${!db.obs.length?'<div class="card"><b>Your ledger is empty.</b><br><small>Tap + to record money you lent or owe.</small></div>':''}
 <h3>Recent activity</h3><div class="card">${recent()}</div>`}
function chips(k,arr){return `<div class="chips">${arr.map(([v,l])=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}='${v}';render()">${l}</button>`).join('')}</div>`}
function srch(){return `<input placeholder="Search name, description, notes" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(window.st);window.st=setTimeout(()=>{const p=this.selectionStart;render();const i=$('input');i.focus();i.setSelectionRange(p,p)},250)">`}
const hit=o=>!S.q||(pName(o.pid)+' '+o.desc+' '+o.notes).toLowerCase().includes(S.q.toLowerCase());
function vPeople(){const f=S.f;const ps=db.people.filter(p=>(!S.q||p.name.toLowerCase().includes(S.q.toLowerCase())||db.obs.some(o=>o.pid===p.id&&hit(o)))&&(f=='all'||(f=='lent'&&pBal(p.id,'lent')>0)||(f=='owe'&&pBal(p.id,'owe')>0)||(f=='settled'&&!pBal(p.id,'lent')&&!pBal(p.id,'owe'))));
 return `<h1>People</h1>${srch()}${chips('f',[['all','All'],['lent','Others owe me'],['owe','I owe'],['settled','Settled']])}<div class="card">${ps.map(p=>{const a=pBal(p.id,'lent'),b=pBal(p.id,'owe');return `<div class="row" onclick="openP('${p.id}')"><b>${esc(p.name)}</b><span>${a?`<b class="gt">${R(a)}</b> `:''}${b?`<b class="rt">${R(b)}</b>`:''}${!a&&!b?'<span class="pill">Settled</span>':''}</span></div>`}).join('')||'<p class="mu">No one here yet.</p>'}</div>`}
function vTxns(){const f=S.tf,os=db.obs.filter(o=>hit(o)&&(f=='del'?o.deleted:live(o)&&(f=='all'||(f=='unpaid'&&bal(o)>0)||(f=='paid'&&bal(o)<=0)||(f=='lent'&&o.dir=='lent')||(f=='owe'&&o.dir=='owe')))).sort((a,b)=>a.date<b.date?1:-1);
 return `<h1>Transactions</h1>${srch()}${chips('tf',[['all','All'],['unpaid','Unpaid'],['paid','Paid'],['lent','Others owe me'],['owe','I owe'],['del','Deleted']])}<div class="card">${os.map(o=>obRow(o)).join('')||'<p class="mu">Nothing found.</p>'}</div>`}
function vDue(){const os=db.obs.filter(act).sort((a,b)=>a.due<b.due?-1:1),g=(l,fn)=>{const x=os.filter(fn);return x.length?`<h3>${l}</h3><div class="card">${x.map(o=>obRow(o)).join('')}</div>`:''};
 return `<h1>Due</h1>${g('Past due',o=>o.due<today())}${g('Due today',o=>o.due==today())}${g('Upcoming',o=>o.due>today())}${os.length?'':'<div class="card">Nothing is due. Your ledger is clear ✓</div>'}`}
function vPerson(){const p=db.people.find(x=>x.id===S.pid);if(!p){S.pid=null;return vDash()}
 const os=db.obs.filter(o=>o.pid===p.id&&live(o));
 const blk=d=>{const x=os.filter(o=>o.dir===d);if(!x.length)return'';const b=pBal(p.id,d),a=x.filter(act),nx=a.map(o=>o.due).sort()[0];
  return `<div class="card ${d=='lent'?'g':'r'}"><small>${d=='lent'?'Others owe me':'I owe'} · balance as of ${fd(today())}</small><h2 class="${d=='lent'?'gt':'rt'}">${R(b)}</h2>
  <small>${d=='lent'?'Total lent':'Total borrowed'} ${R(x.reduce((s,o)=>s+o.principal,0))} · Repaid ${R(x.reduce((s,o)=>s+paidOf(o),0))} · Active ${a.length} · Next due ${fd(nx)}</small>
  ${b>0?`<br><button class="sm" onclick="openRepay('${p.id}','${d}')">Record payment</button> <button class="sm" onclick="settle('${p.id}','${d}')">Settle account</button>`:'<div class="paid">✓ Settled</div>'}</div>`};
 const hs=[];db.pays.filter(y=>y.pid===p.id).forEach(y=>hs.push([y.date,(y.settle?'Settled ':'Payment ')+R(y.amt)]));db.ints.forEach(i=>{const o=db.obs.find(x=>x.id===i.oid);if(o&&o.pid===p.id&&live(o))hs.push([i.date,'Interest +'+R(i.amt)])});hs.sort().reverse();
 return `<button class="sm" onclick="S.pid=null;render()">← Back</button><h1>${esc(p.name)}</h1><button class="sm" onclick="openMerge('${p.id}')">Merge duplicate</button>${blk('lent')}${blk('owe')}
 <h3>Active transactions</h3><div class="card">${os.filter(act).map(o=>obRow(o)).join('')||'<small>None</small>'}</div>
 <h3>Settled transactions</h3><div class="card">${os.filter(o=>!act(o)).map(o=>obRow(o)).join('')||'<small>None</small>'}</div>
 <h3>Payments &amp; interest</h3><div class="card">${hs.map(h=>`<div class="row"><span>${esc(h[1])}</span><small>${fd(h[0])}</small></div>`).join('')||'<small>None</small>'}</div>`}
function timeline(o){const ev=[{d:o.date,t:(o.dir=='lent'?'Lent ':'Borrowed ')+R(o.principal),a:o.principal,k:0}];
 db.ints.filter(i=>i.oid===o.id).forEach(i=>ev.push({d:i.date,t:'Interest +'+R(i.amt),a:i.amt,k:1,id:i.id}));
 db.pays.forEach(p=>p.alloc.filter(a=>a.oid===o.id).forEach(a=>ev.push({d:p.date,t:(p.settle?'Settlement ':'Payment ')+R(a.amt),a:-a.amt,k:2})));
 ev.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k);let b=0;
 return ev.map(e=>{b+=e.a;return `<div class="tl"><b>${fd(e.d)}</b> ${e.t}${e.id?` <a onclick="editInt('${e.id}')">edit</a>`:''}<br><small>Balance ${R(b)}</small></div>`}).join('')+(b<=0?'<div class="paid">✓ Paid</div>':'')}
function openOb(id){const o=db.obs.find(x=>x.id===id);sheet(`<h3>${esc(pName(o.pid))} · ${esc(o.desc||'Transaction')}</h3><small>${esc(o.notes||'')}</small><h2>${R(bal(o))}</h2>${nx(o)?`<small>If unpaid after ${fd(o.due)}: ${R(bal(o)+nx(o))}</small>`:''}${timeline(o)}
 <div style="margin-top:10px">${o.deleted?`<button class="sm" onclick="delOb('${id}',0)">Restore</button>`:`<button class="sm" onclick="openEdit('${id}')">Edit</button> <button class="sm" onclick="delOb('${id}',1)">Delete</button>`}</div>`)}
function editInt(id){const i=db.ints.find(x=>x.id===id);sheet(`<h3>Edit interest · ${fd(i.date)}</h3><small>Only this cycle changes.</small><input id="ii" type="number" step="any" value="${i.amt/100}"><button class="pri" onclick="saveInt('${id}')">Save</button>`)}
function saveInt(id){const i=db.ints.find(x=>x.id===id),n=P($('#ii').value);if(!(n>=0))return toast('Enter a valid amount');commit('Interest updated',()=>{i.amt=n},`Interest ${fd(i.date)} ${R(i.amt)} → ${R(n)}`)}
function sure(m,f){window._f=f;sheet(`<h3>Please confirm</h3><p>${esc(m)}</p><button class="pri" onclick="_f()">Confirm</button><button class="pri" style="background:var(--cd);color:var(--tx)" onclick="closeSh()">Cancel</button>`)}
const nm=(s,d)=>{const[y,m]=s.split('-').map(Number);return fISO(new Date(y,m,d))};
const nx=o=>{const b=bal(o);return b>0?(o.pct?Math.round(b*o.pct/100):o.interest||0):0};
function lPrev(){const a=P($('#fa').value),v=parseFloat($('#fi').value);if(!(a>0)||!(v>0)){$('#ip').textContent='';return}const x=$('#ft').value=='p'?Math.round(a*v/100):Math.round(v*100);$('#ip').innerHTML=`Charge ${R(x)} added now · <b>${R(a+x)}</b> to pay by ${fd($('#fu').value)}. If unpaid, another charge is added on that date.`}
function openEdit(id){const o=db.obs.find(x=>x.id===id);sheet(`<h3>Edit transaction</h3><label>Amount ₹<input id="ea" type="number" step="any" value="${o.principal/100}" oninput="ePrev('${id}')"></label><input id="ex" value="${esc(o.desc)}" placeholder="Description"><input id="eo" value="${esc(o.notes)}" placeholder="Notes"><label>Next due date<input id="eu" type="date" value="${o.due}"></label><div style="display:flex;gap:6px"><select id="et" style="width:110px"><option value="a">₹ / month</option><option value="p" ${o.pct?'selected':''}>% / month</option></select><input id="ei" type="number" step="any" value="${o.pct||o.interest/100||''}" placeholder="Interest"></div><p id="ev" class="mu"></p><button class="pri" onclick="saveEdit('${id}')">Confirm changes</button>`);ePrev(id)}
function ePrev(id){const o=db.obs.find(x=>x.id===id),n=P($('#ea').value);$('#ev').textContent=n>0?`Balance ${R(bal(o))} → ${R(n+intOf(o)-paidOf(o))} (past interest and payments unchanged)`:''}
function saveEdit(id){const o=db.obs.find(x=>x.id===id),n=P($('#ea').value),du=$('#eu').value,pc=$('#et').value=='p',v=parseFloat($('#ei').value)||0;
 if(!(n>0)||!du||!(v>=0)||(pc&&v>100))return toast('Check amount, due date and interest');if(n+intOf(o)-paidOf(o)<0)return toast('Payments already exceed the new amount');
 commit('Transaction updated',()=>{o.principal=n;o.desc=$('#ex').value.trim();o.notes=$('#eo').value.trim();o.due=du;o.pct=pc?v:0;o.interest=pc?0:Math.round(v*100)},`Edited ${pName(o.pid)} transaction (amount ${R(o.principal)} → ${R(n)}, due ${fd(du)})`)}

let RP={};function openRepay(pid,d){RP={pid:pid||null,dir:d||'lent'};rpDraw()}
